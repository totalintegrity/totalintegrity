baseURL = 'https://totalintegrity.eu/'
locale = 'en-us'
title = 'Total Integrity'
theme = "papermod"

[params]
  fuseOpts = { isCaseSensitive = false, includeScore = true, shouldSort = true, location = 0, distance = 100, threshold = 0.4, minMatchCharLength = 2, keys = ["title", "permalink", "summary", "content"] }

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "faq"
    name = "FAQ"
    url = "/faq/"
    weight = 20
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
